server {
    listen 8080;

    # API routing: Pass all requests starting with /api to the todo-app service
    location /api/ {
        proxy_pass http://todo-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default routing: Serve static files from /usr/share/nginx/html
    location / {
        root /usr/share/nginx/html;
        # Try index.html first, then index.htm, then look for a matching file
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}