openapi: 3.0.0
info:
  title: Todo List API
  version: 1.0.0
  description: RESTful API for managing todo lists with HATEOAS support

servers:
  - url: /api/todo-lists
    description: Local development server

components:
  schemas:
    TodoList:
      type: object
      required:
        - title
        - position
      properties:
        id:
          type: integer
          format: int64
          description: Auto-generated primary key (not included in responses)
        title:
          type: string
          description: Title of the todo list
          example: "My Tasks"
        position:
          type: integer
          description: Sort order for the todo list
          example: 1
        topLevelItems:
          type: array
          description: Top-level list items belonging to this todo list (read-only)
          readOnly: true
          items:
            $ref: '#/components/schemas/ListItem'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (read-only)
          example: "2025-10-16T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (read-only)
          example: "2025-10-16T10:45:00Z"
        createdBy:
          type: integer
          description: ID of the user who created this todo list (read-only)
        updatedBy:
          type: integer
          description: ID of the user who last updated this todo list (read-only)

    TodoListCollectionItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/TodoList'
        - type: object
          properties:
            self:
              type: string
              format: uri
              description: Link to the todo list resource

    ListItem:
      type: object
      required:
        - title
        - position
        - type
      properties:
        id:
          type: integer
          format: int64
          description: Auto-generated primary key (not included in responses)
        title:
          type: string
          description: Title of the list item
          example: "My Section"
        position:
          type: integer
          description: Sort order for the list item
          example: 1
        type:
          type: string
          enum:
            - SECTION
            - LIST_ITEM
          description: Type of the list item
          example: "LIST_ITEM"
        itemText:
          type: string
          description: Text content of the list item (only for LIST_ITEM type)
          example: "Buy groceries"
        subItems:
          type: array
          description: Child list items nested under this item (recursive) (read-only)
          readOnly: true
          items:
            $ref: '#/components/schemas/ListItem'
        complete:
          type: boolean
          description: Completion status of the list item
          default: false
          example: false
        parentId:
          type: integer
          description: ID of the parent list item (null for top-level items)
        todoListId:
          type: integer
          description: ID of the todo list this item belongs to
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (read-only)
          example: "2025-10-16T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (read-only)
          example: "2025-10-16T10:45:00Z"
        createdBy:
          type: integer
          description: ID of the user who created this list item (read-only)
        updatedBy:
          type: integer
          description: ID of the user who last updated this list item (read-only)

    ListItemCollectionItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/ListItem'
        - type: object
          properties:
            self:
              type: string
              format: uri
              description: Link to the todo list item resource

paths:
  /api/todo-lists:
    get:
      summary: List all todo lists
      tags:
        - "TodoList"
      operationId: getAllTodoLists
      responses:
        '200':
          description: A collection of todo lists with self-referential links (HATEOAS)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoListCollectionItem'
    post:
      summary: Create a new todo list
      tags:
        - "TodoList"
      operationId: createTodoList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoList'
      responses:
        '201':
          description: Todo list created successfully. Response includes self link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TodoListCollectionItem'
        '400':
          description: Invalid request body

  /api/todo-lists/{id}:
    get:
      summary: Get a todo list by ID
      tags:
        - "TodoList"
      operationId: getTodoListById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The unique identifier of the todo list
      responses:
        '200':
          description: The requested todo list with self-referential link (HATEOAS)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TodoListCollectionItem'
        '404':
          description: Todo list not found

    put:
      summary: Update an existing todo list
      tags:
        - "TodoList"
      operationId: updateTodoListById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The unique identifier of the todo list to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoList'
      responses:
        '200':
          description: Todo list updated successfully. Response includes self link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TodoListCollectionItem'
        '404':
          description: Todo list not found
        '422':
          description: Invalid request (e.g., ID mismatch)


  /api/list-items:
    get:
      summary: List all items for a todo list
      tags:
        - "ListItem"
      parameters:
        - name: listId
          in: query
          required: true
          schema:
            type: integer
            format: int64
          description: The unique identifier of the todo list to load items for
      operationId: getListItemsForList
      responses:
        '200':
          description: A collection of todo list items with self-referential links (HATEOAS)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListItemCollectionItem'
    post:
      summary: Create a new todo list item
      tags:
        - "ListItem"
      operationId: createListItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListItem'
      responses:
        '201':
          description: Todo list item created successfully. Response includes self link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListItemCollectionItem'
        '400':
          description: Invalid request body