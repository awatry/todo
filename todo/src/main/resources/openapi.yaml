openapi: 3.0.0
info:
  title: Todo List API
  version: 1.0.0
  description: RESTful API for managing todo lists with HATEOAS support

servers:
  - url: /api/todo-lists
    description: Local development server

components:
  schemas:
    TodoList:
      type: object
      required:
        - title
        - position
      properties:
        id:
          type: integer
          format: int64
          description: Auto-generated primary key (not included in responses)
        title:
          type: string
          description: Title of the todo list
          example: "My Tasks"
        position:
          type: integer
          description: Sort order for the todo list
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (read-only)
          example: "2025-10-16T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp (read-only)
          example: "2025-10-16T10:45:00Z"
        createdBy:
          type: integer
          description: ID of the user who created this todo list (read-only)
        updatedBy:
          type: integer
          description: ID of the user who last updated this todo list (read-only)

    TodoListCollectionItem:
      type: object
      allOf:
        - $ref: '#/components/schemas/TodoList'
        - type: object
          properties:
            self:
              type: string
              format: uri
              description: Link to the todo list resource

paths:
  /api/todo-lists:
    get:
      summary: List all todo lists
      operationId: getAllTodoLists
      responses:
        '200':
          description: A collection of todo lists with self-referential links (HATEOAS)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoListCollectionItem'
    post:
      summary: Create a new todo list
      operationId: createTodoList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoList'
      responses:
        '201':
          description: Todo list created successfully. Response includes self link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TodoListCollectionItem'
        '400':
          description: Invalid request body

  /api/todo-lists/{id}:
    get:
      summary: Get a todo list by ID
      operationId: getTodoListById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The unique identifier of the todo list
      responses:
        '200':
          description: The requested todo list with self-referential link (HATEOAS)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TodoListCollectionItem'
        '404':
          description: Todo list not found

    put:
      summary: Update an existing todo list
      operationId: updateTodoListById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The unique identifier of the todo list to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TodoList'
      responses:
        '200':
          description: Todo list updated successfully. Response includes self link.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TodoListCollectionItem'
        '404':
          description: Todo list not found
        '422':
          description: Invalid request (e.g., ID mismatch)
